name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Run typecheck (mypy)
        run: uv run mypy src scripts/benchmark_regression.py

      - name: Run test suite (pytest)
        run: uv run pytest

      - name: Run benchmark regression suite
        run: uv run python scripts/benchmark_regression.py -v
