version: 1
rtfm:
  corpus: "adv_budget_01"
  project_root: "."
section_cards:
  path: "section_cards.yaml"
  required: true
context:
  context_token_budget: 1200
  min_score: 0.1
  max_source_spans: 10
  role_budgets:
    target_text: 0.5
    local_context: 0.2
    dependency: 0.2
    reference: 0.1
cache:
  enabled: false
  path: ".writing-context/context_cache.sqlite"
