version: 1

rtfm:
  corpus: manuscript
  project_root: .
  sync_before_pack: true

context:
  default_token_budget: 12000
  reserved_generation_margin: 0.10
  max_search_results_per_query: 10
  max_source_spans: 35
  include_source_excerpts: false

cache:
  enabled: true
  path: .writing-context/context_cache.sqlite
  invalidate_on_refresh: true

section_cards:
  path: .writing-context/section_cards.yaml
  required: false

# Card scaffolding generator configuration
# generator:
#   # The model to use (e.g. gpt-4o-mini, Qwen/Qwen2.5-Coder-7B-Instruct, phi3)
#   # model: gpt-4o-mini
#   # The API endpoint base URL
#   # api_base: https://api.openai.com/v1
