version: 1

document:
  title: "Working document title"
  thesis: "One or two sentences describing the manuscript's central purpose."
  writing_style:
    tone: "academic, formal, concise"
    avoid:
      - "unsupported claims"
      - "overly broad conclusions"

sections:
  section_1:
    title: "Introduction"
    role: "Define the problem, motivation, and contribution."
    path: "sections/01_introduction.tex"
    key_terms:
      - "territorial prioritization"
      - "emergency management"
    depends_on: []
    must_preserve:
      - "The system supports decision-making; it does not replace human judgment."
    avoid:
      - "operational deployment claims"
    constraints:
      - "Ensure all citations use the \cite{} format."
      - "Maintain consistent capitalization for technical terms like 'Territorial Prioritization'."

  section_2:
    title: "Methodology"
    role: "Describe the algorithmic approach to territorial prioritization."
    path: "sections/02_methodology.tex"
    key_terms:
      - "quantization"
      - "priority-aware sampling"
    depends_on:
      - "section_1"
    must_preserve:
      - "The sampling frequency is fixed at 1Hz for real-time compliance."
    constraints:
      - "Do not alter the mathematical notation in equation environments."
