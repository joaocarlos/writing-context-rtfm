[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "writing-context-rtfm"
version = "0.5.2"
description = "MCP extension for writing-context retrieval relying on RTFM"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "João Carlos N. Bittencourt"}
]
license = {text = "MIT"}
keywords = ["mcp", "rtfm", "context-reduction", "llm-writing", "mcp-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "rtfm-ai[embeddings]",
    "pyyaml",
    "pylatexenc"
]

[project.optional-dependencies]
tiktoken = [
    "tiktoken",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[project.scripts]
writing-context-rtfm = "writing_context_rtfm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/writing_context_rtfm"]
