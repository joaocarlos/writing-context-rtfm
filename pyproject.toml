[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "benchmark/**",
    "scripts/ab_test_generation.py",
    "scripts/audit_benchmark_cases.py",
    "scripts/benchmark_*.py",
    "scripts/review_benchmark_annotations.py",
    "src/writing_context_rtfm/benchmark.py",
    "src/writing_context_rtfm/bibtex_handoff.py",
    "src/writing_context_rtfm/candidate_exposure.py",
    "src/writing_context_rtfm/rtfm_sync_explicit.py",
    "test-project/**",
    "tests/test_benchmark_context_quality.py",
    "tests/test_bibtex_handoff.py",
    "tests/test_candidate_exposure.py",
]

[project]
name = "writing-context-rtfm"
version = "0.11.3"
description = "MCP extension for writing-context retrieval relying on RTFM"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "João Carlos N. Bittencourt"}
]
license = {text = "MIT"}
keywords = ["mcp", "rtfm", "context-reduction", "llm-writing", "mcp-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "rtfm-ai[embeddings]>=0.28.1",
    "pyyaml",
    "pylatexenc",
    "mcp>=1.27.1",
]

[project.optional-dependencies]
tiktoken = [
    "tiktoken",
]
local-models = [
    "sentence-transformers>=3.4.1",
    "transformers>=4.48.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.0",
    "basedpyright>=1.0",
    "pre-commit>=3.0",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501", "E402", "N806", "B023", "SIM102", "SIM117"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false


[project.scripts]
writing-context-rtfm = "writing_context_rtfm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/writing_context_rtfm"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
